name: Deploy to VM

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Clean previous build
        run: rm -rf _site

      - name: Render (id profile)
        run: quarto render

      - name: Render (en profile)
        run: quarto render --profile en --no-clean

      - name: Remove stray nested build artifact
        run: rm -rf _site/en/_site

      - name: Sync to webroot
        run: rsync -a --delete _site/ /var/www/pbp/

